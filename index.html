<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 孖寶學字詞 - 5歲小朋友</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Comic Sans MS", "Microsoft JhengHei", sans-serif; }
        /* Disable touch zoom and double-tap zoom */
        html, body { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; touch-action: manipulation; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .menu { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .menu-btn { padding: 20px 40px; font-size: 1.5em; border: none; border-radius: 20px; cursor: pointer; transition: all 0.3s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .menu-btn:hover { transform: translateY(-3px); }
        .btn-flashcards { background: #FF6B6B; color: white; }
        .btn-quiz { background: #4ECDC4; color: white; }
        .btn-matching { background: #FFE66D; color: #333; }
        .btn-add { background: #95E1D3; color: #333; }
        .btn-dictation { background: #F7DC6F; color: #333; }
        
        .game-area { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; }
        .game-area.active { display: block; }
        
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 30px 0; }
        .card { width: 150px; height: 180px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .card-front { background: linear-gradient(145deg, #FF9A9E, #FECFEF); font-size: 4em; }
        .card-back { background: linear-gradient(145deg, #A8EDEA, #FED6E3); font-size: 2em; color: #333; }
        
        .progress-bar { width: 100%; height: 30px; background: #f0f0f0; border-radius: 15px; overflow: hidden; margin: 20px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 15px; transition: width 0.5s; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        
        .back-btn { padding: 15px 30px; font-size: 1.2em; border: none; border-radius: 10px; background: #667eea; color: white; cursor: pointer; margin: 5px; }
        
        .category-tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .category-tab { padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-size: 1.1em; background: #f0f0f0; }
        .category-tab.active { background: #667eea; color: white; }
        
        .score { font-size: 1.5em; text-align: center; margin: 20px 0; }
        .emoji { font-size: 3em; text-align: center; }
        
        .options { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .option-btn { padding: 20px 30px; font-size: 1.5em; border: none; border-radius: 15px; cursor: pointer; background: #f0f0f0; transition: all 0.3s; }
        .option-btn:hover { background: #667eea; color: white; }
        .option-btn.correct { background: #4ECDC4 !important; color: white !important; }
        .option-btn.wrong { background: #FF6B6B !important; color: white !important; }
        
        .encourage { font-size: 2em; text-align: center; color: #667eea; margin: 20px 0; }
        
        .matching-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 600px; margin: 0 auto; }
        .matching-card { aspect-ratio: 1; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5em; cursor: pointer; transition: all 0.3s; }
        .matching-card:hover { transform: scale(1.05); }
        .matching-card.selected { border: 3px solid #667eea; }
        .matching-card.matched { opacity: 0; pointer-events: none; }
        
        .add-word-form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
        .add-word-form input { padding: 15px; font-size: 1.2em; border: 2px solid #ddd; border-radius: 10px; }
        .add-word-form button { padding: 15px; font-size: 1.3em; border: none; border-radius: 10px; background: #4ECDC4; color: white; cursor: pointer; }
        
        .speak-btn {

            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 35px; 
            height: 35px; 
            font-size: 1em; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            margin-left: 8px;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .speak-btn:hover { transform: scale(1.1); background: #764ba2; }
        .card-back {

            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 5px;
        }
        .word-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .word-english { font-size: 0.8em; color: #666; }

                </div>
            </div>
            
            <div style="text-align: center; margin: 15px 0;">

        </div>
    </div>
    
    <script>
        // Load voices early
        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();
        };
        
        // Helper: Ensure voices are loaded before speaking (fixes Android)
        // Pre-load voices on page load (Android Chrome workaround)
        function preloadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Force multiple loads for Android
            setTimeout(() => window.speechSynthesis.getVoices(), 100);
            setTimeout(() => window.speechSynthesis.getVoices(), 300);
            setTimeout(() => window.speechSynthesis.getVoices(), 600);
        }
        // Try to load voices early
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = preloadVoices;
            preloadVoices();
        }
        
        function ensureVoicesLoaded() {
            return new Promise((resolve) => {
                let voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    resolve(voices);
                    return;
                }
                // Android Chrome workaround: wait for voiceschanged
                const onVoicesChanged = () => {
                    voices = window.speechSynthesis.getVoices();
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoicesChanged);
                    resolve(voices);
                };
                window.speechSynthesis.addEventListener('voiceschanged', onVoicesChanged);
                // Fallback timeout for Android (longer)
                setTimeout(() => {
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoicesChanged);
                    resolve(window.speechSynthesis.getVoices());
                }, 1000);
            });
        }

        // Speak text function
        async function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                try {
                    // Cancel any ongoing speech
                    window.speechSynthesis.cancel();
                    
                    // Wait for voices to load (fixes Android)
                    const voices = await ensureVoicesLoaded();
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.8; // Slower for kids
                    utterance.pitch = 1.1; // Slightly higher pitch for friendliness
                    
                    // For Chinese, prioritize Cantonese (粵語) over Mandarin
                    if (lang === 'zh-HK' || lang === 'zh-CN') {
                        // Priority: yue > zh-HK > Cantonese > zh-CN > others
                        let chineseVoice = null;
                        
                        // First: try yue (Cantonese code)
                        chineseVoice = voices.find(v => v.lang.includes('yue'));
                        
                        // Second: try zh-HK
                        if (!chineseVoice) {
                            chineseVoice = voices.find(v => v.lang.includes('zh-HK'));
                        }
                        
                        // Third: try Cantonese in name
                        if (!chineseVoice) {
                            chineseVoice = voices.find(v => v.name.toLowerCase().includes('cantonese'));
                        }
                        
                        // Fourth: try zh-CN but ONLY if no Cantonese found
                        if (!chineseVoice) {
                            chineseVoice = voices.find(v => v.lang.includes('zh-CN'));
                        }
                        
                        // Fifth: any Chinese voice
                        if (!chineseVoice) {
                            chineseVoice = voices.find(v => 
                                v.lang.includes('zh') || v.lang.includes('cmn')
                            );
                        }
                        
                        if (chineseVoice) {
                            utterance.voice = chineseVoice;
                            utterance.lang = chineseVoice.lang;
                            console.log('Using voice:', chineseVoice.name, chineseVoice.lang);
                        } else {
                            console.log('No Chinese voice found');
                            utterance.lang = 'zh-HK'; // Force Cantonese
                        }
                    } else {
                        // For English, try to find English voice
                        const englishVoice = voices.find(v => v.lang.includes('en'));
                        if (englishVoice) {
                            utterance.voice = englishVoice;
                        }
                        utterance.lang = lang;
                    }
                    
                    // Add error handler
                    utterance.onerror = function(e) {
                        console.log('Speech error:', e);
                    };
                    
                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.log('Speech error:', e);
                }
            } else {
                alert('呢部機未支援語音功能 🤷');
            }
        }

                const text = isEnglish ? w.english : w.chinese;
                const lang = isEnglish ? 'en' : 'zh-HK';
                
                // Text card
                pairs.push({ 
                    type: 'text', 
                    content: text, 
                    id: 'txt' + i, 
                    matchId: 'snd' + i,
                    lang: lang
                });
                // Audio card (🔊)
                pairs.push({ 
                    type: 'audio', 
                    content: '🔊', 
                    id: 'snd' + i,

                });
            });
            
            const shuffled = shuffle(pairs);
            document.getElementById('match-score').textContent = '⭐ ' + matchScore;
            document.getElementById('match-grid').innerHTML = shuffled.map((p, idx) => {
                const bgColor = p.type === 'text' ? '#FF9A9E' : '#FFE66D';
                const fontSize = p.type === 'text' ? '1.5em' : '3em';
                return `<div class="matching-card" style="background:${bgColor};font-size:${fontSize}"

            }).join('');

        function selectMatch(card) {
            // Play audio if it's an audio card
            if (card.textContent.trim() === '🔊') {
                const lang = card.dataset.lang;
                // Find the matching text card to get the word
                const textCardId = card.dataset.mid;
                const textCard = document.querySelector(`[data-id="${textCardId}"]`);
                if (textCard) {
                    speakMatchText(textCard.textContent.trim(), lang);
                }
            }
            
            if (card.classList.contains('matched')) return;
            if (!selectedMatch) {
                selectedMatch = card;
                card.classList.add('selected');
            } else {
                if (selectedMatch.dataset.id === card.dataset.id) {
                    selectedMatch.classList.remove('selected');
                    selectedMatch = null;
                } else if (selectedMatch.dataset.mid === card.dataset.id) {
                    card.classList.add('matched');
                    selectedMatch.classList.add('matched');
                    matchScore++;
                    document.getElementById('match-score').textContent = '⭐ ' + matchScore;
                    selectedMatch = null;
                    const remaining = document.querySelectorAll('.matching-card:not(.matched)');
                    if (remaining.length === 0) {
                        setTimeout(() => { alert('🎊 完成晒！勁呀！⭐⭐⭐'); matchScore = 0; initMatching(); }, 500);
                    }
                } else {
                    selectedMatch.classList.remove('selected');
                    selectedMatch = card;
                    card.classList.add('selected');
                }
            }
        }
        
        // Speak text for matching game
        async function speakMatchText(text, lang) {
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    // Wait for voices to load (fixes Android)
                    const voices = await ensureVoicesLoaded();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.8;
                    utterance.pitch = 1.1;
                    
                    // For Chinese, prioritize Cantonese (粵語)
                    if (lang === 'zh-HK' || lang === 'zh-CN') {
                        let chineseVoice = null;
                        chineseVoice = voices.find(v => v.lang.includes('yue'));
                        if (!chineseVoice) chineseVoice = voices.find(v => v.lang.includes('zh-HK'));
                        if (!chineseVoice) chineseVoice = voices.find(v => v.name.toLowerCase().includes('cantonese'));
                        if (!chineseVoice) chineseVoice = voices.find(v => v.lang.includes('zh-CN'));
                        if (!chineseVoice) chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
                        
                        if (chineseVoice) {
                            utterance.voice = chineseVoice;
                            utterance.lang = chineseVoice.lang;
                        } else {
                            utterance.lang = 'zh-HK';
                        }
                    } else {
                        const englishVoice = voices.find(v => v.lang.includes('en'));
                        if (englishVoice) utterance.voice = englishVoice;
                        utterance.lang = lang;
                    }
                    
                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.log('Speech error:', e);
                }
            }
        }
        
        // Add word
        function addWord() {
            const cat = document.getElementById('add-category').value.trim();
            const w = document.getElementById('add-word').value.trim();
            const e = document.getElementById('add-emoji').value.trim();
            const en = document.getElementById('add-english').value.trim();
            if (!cat || !w || !e) {
                document.getElementById('add-result').innerHTML = '❌ 要填晒類別、文字、Emoji！';
                return;
            }
            if (!vocabulary[cat]) vocabulary[cat] = [];
            vocabulary[cat].push({ chinese: w, emoji: e, english: en });
            document.getElementById('add-result').innerHTML = `✅ 加入成功！<br><div style="font-size:2em">${e}</div><div>${w} = ${en}</div>`;
            ['add-category','add-word','add-emoji','add-english'].forEach(id => document.getElementById(id).value = '');
        }
        
        // ========== Dictation Game ==========
        const dictationSentences = {
            '📖 Unit 2': [
                { sentence: 'A long time ago, there was an evil and dangerous dragon on a high mountain.', hint: 'dragon, mountain' },
                { sentence: 'At night, it went to the villages, burnt them down and hurt the villagers.', hint: 'night, villages' },
                { sentence: 'Everyone was afraid of it.', hint: 'afraid' },
                { sentence: 'Carlo was a young hunter.', hint: 'young hunter' },
                { sentence: 'To save the villagers, he had to kill the dragon.', hint: 'save, kill' },
                { sentence: 'He came to a forest and he walked through the trees.', hint: 'forest, trees' },
                { sentence: 'He heard some noises. Soon he saw a beautiful white horse with wings!', hint: 'noises, horse' },
                { sentence: 'He rode on it and went on his way.', hint: 'rode' },
                { sentence: 'Later, Carlo met an old woman in the market.', hint: 'market' },
                { sentence: 'She needed some clothes to keep warm.', hint: 'clothes, warm' },
                { sentence: 'Carlo bought her a cape. The old woman was thankful.', hint: 'cape, thankful' },
                { sentence: 'She gave Carlo a sword!', hint: 'sword' },
                { sentence: 'It was a good weapon for killing dragons.', hint: 'weapon, dragons' }
            ]
        };
        
        function getDictCategories() { return Object.keys(dictationSentences); }
        
        function initDictation() {
            document.getElementById('dict-tabs').innerHTML = getDictCategories().map(cat => 
                `<button class="category-tab ${cat === dictCategory ? 'active' : ''}" onclick="switchDictCategory('${cat}')">${cat}</button>`
            ).join('');
            
            // Show quantity control
            document.getElementById('dict-quantity-control').style.display = 'block';
            const availableSents = dictationSentences[dictCategory].length;
            document.getElementById('dict-quantity-slider').max = Math.min(20, availableSents);
            if (dictQuantity > availableSents) dictQuantity = availableSents;
            document.getElementById('dict-quantity-slider').value = dictQuantity;
            document.getElementById('dict-quantity-display').textContent = `${dictQuantity} 題 / 共 ${availableSents} 題`;
            
            // Show sentence list before starting
            document.getElementById('dict-score').textContent = '✅ 0 | ❌ 0';
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';
            
            const allSents = shuffle([...dictationSentences[dictCategory]]);
            dictSentenceList = allSents.slice(0, dictQuantity);
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = false;
            
            // Show preview
            document.getElementById('dict-sentence').innerHTML = `
                <div style="font-size: 1.1em; color: #667eea; margin-bottom: 15px;">📖 ${dictCategory}</div>
                <div style="font-size: 1em; color: #888;">共 ${dictSentenceList.length} 句</div>
            `;
            document.getElementById('dict-hint').textContent = '';
            document.getElementById('dict-options').innerHTML = `
                <button class="back-btn" style="background: #F7DC6F; font-size: 1.5em; padding: 20px 40px; color: #333;" onclick="startDictation()">▶️ 開始讀默</button>
            `;
            document.getElementById('dict-encourage').textContent = '';
            document.getElementById('dict-progress').style.width = '0%';
            document.getElementById('dict-progress').textContent = '0/0';
        }
        
        function updateDictQuantity(value) {
            dictQuantity = parseInt(value);
            const availableSents = dictationSentences[dictCategory].length;
            document.getElementById('dict-quantity-display').textContent = `${dictQuantity} 題 / 共 ${availableSents} 題`;
        }
        
        function switchDictCategory(cat) {
            dictCategory = cat;
            dictQuantity = Math.min(5, dictationSentences[cat].length);
            initDictation();
        }
        
        function startDictation() {
            const allSents = shuffle([...dictationSentences[dictCategory]]);
            dictSentenceList = allSents.slice(0, dictQuantity);
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = true;
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';
            renderDictSentence();
        }
        
        function renderDictSentence() {
            if (dictCurrent >= dictSentenceList.length) {
                showDictFinish();
                return;
            }
            
            const item = dictSentenceList[dictCurrent];
            document.getElementById('dict-progress').style.width = ((dictCurrent + 1) / dictSentenceList.length * 100) + '%';
            document.getElementById('dict-progress').textContent = `${dictCurrent + 1}/${dictSentenceList.length}`;
            document.getElementById('dict-score').textContent = `✅ ${dictCorrect} | ❌ ${dictWrong}`;
            
            // Show hint (partial sentence)
            document.getElementById('dict-hint').textContent = `💡 提示：${item.hint}`;
            
            // Hide the actual sentence and show blanks
            const words = item.sentence.split(' ');
            let blankSentence = item.sentence.replace(/[a-zA-Z]/g, '_');
            document.getElementById('dict-sentence').innerHTML = `
                <div style="font-size: 1.2em; color: #667eea; line-height: 1.8;">
                    <span style="background: #f0f0f0; padding: 5px 15px; border-radius: 10px;">___ ___ ___</span>
                </div>
            `;
            
            // Play sentence automatically
            setTimeout(() => playDictSentence(), 500);
            
            // Generate options (correct + 3 wrong)
            const allSents = dictationSentences[dictCategory];
            const wrongOptions = allSents.filter(s => s.sentence !== item.sentence);
            const shuffledWrong = shuffle(wrongOptions).slice(0, 3);
            let options = [item, ...shuffledWrong];
            options = shuffle(options);
            
            document.getElementById('dict-options').innerHTML = options.map(opt => 
                `<button class="option-btn" style="font-size: 1.1em; padding: 15px 20px;" onclick="checkDictAnswer(this, '${opt.sentence.replace(/'/g, "\\'")}', '${item.sentence.replace(/'/g, "\\'")}')">${opt.sentence.substring(0, 50)}...</button>`
            ).join('');
            
            document.getElementById('dict-encourage').textContent = '';
        }
        
        async function playDictSentence() {
            if (dictCurrent >= dictSentenceList.length) return;
            const text = dictSentenceList[dictCurrent].sentence;
            
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const voices = await ensureVoicesLoaded();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.7; // Slower for kids
                    utterance.pitch = 1.1;
                    
                    const englishVoice = voices.find(v => v.lang.includes('en'));
                    if (englishVoice) utterance.voice = englishVoice;
                    utterance.lang = 'en';
                    
                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.log('Speech error:', e);
                }
            }
        }
        
        function checkDictAnswer(btn, ans, correct) {
            // Disable all buttons
            document.querySelectorAll('#dict-options .option-btn').forEach(b => b.disabled = true);
            
            if (ans === correct) {
                btn.classList.add('correct');
                dictCorrect++;
                document.getElementById('dict-encourage').textContent = '✅ 啱喇！';
                document.getElementById('dict-sentence').innerHTML = `
                    <div style="font-size: 1.2em; color: #4ECDC4; line-height: 1.8;">✓</div>
                    <div style="font-size: 1em; color: #333; margin-top: 10px; font-style: italic;">"${correct}"</div>
                `;
            } else {
                btn.classList.add('wrong');
                dictWrong++;
                dictWrongList.push(dictSentenceList[dictCurrent]);
                document.getElementById('dict-encourage').textContent = '❌ 再聽多次';
                document.getElementById('dict-review-btn').innerHTML = `📝 查看錯題 (${dictWrong})`;
                document.getElementById('dict-review-btn').style.display = 'block';
                document.getElementById('dict-sentence').innerHTML = `
                    <div style="font-size: 1.2em; color: #FF6B6B; line-height: 1.8;">✗</div>
                    <div style="font-size: 1em; color: #666; margin-top: 10px; font-style: italic;">"${correct}"</div>
                `;
            }
            
            document.getElementById('dict-score').textContent = `✅ ${dictCorrect} | ❌ ${dictWrong}`;
            
            setTimeout(() => {
                dictCurrent++;
                renderDictSentence();
            }, 2000);
        }
        
        function showDictFinish() {
            const finishMsg = dictWrong === 0 
                ? '🎉 全部答啱喇！勁呀！'
                : `📝 完成！對咗 ${dictCorrect} 題 / 錯咗 ${dictWrong} 題`;
            
            let wrongCardsHtml = '';
            if (dictWrong > 0) {
                wrongCardsHtml = `
                    <div style="margin: 20px 0; padding: 15px; background: #fff5f5; border-radius: 15px;">
                        <div style="font-size: 1.2em; color: #e74c3c; margin-bottom: 15px;">📝 錯題一覽：</div>
                        <div style="text-align: left; max-height: 200px; overflow-y: auto;">
                            ${dictWrongList.map((w, i) => `
                                <div style="background: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                                    <div style="font-size: 0.9em; color: #666;">句 ${i + 1}</div>
                                    <div style="font-size: 1em; color: #333;">"${w.sentence}"</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('dict-progress').style.width = '100%';
            document.getElementById('dict-progress').textContent = '完成！';
            
            document.getElementById('dict-options').innerHTML = `
                <div style="text-align:center;padding:30px;">
                    <div style="font-size:3em;margin-bottom:20px;">${dictWrong === 0 ? '🎉' : '💪'}</div>
                    <div style="font-size:1.5em;color:#667eea;margin-bottom:20px;">${finishMsg}</div>
                    ${wrongCardsHtml}
                    <div style="margin-top:30px;">
                        ${dictWrong > 0 ? `<button onclick="reviewDictWrong()" style="padding:15px 30px;font-size:1.2em;background:#FFE66D;border:none;border-radius:15px;cursor:pointer;color:#333;margin:5px;">🔄 溫習錯題 (${dictWrong}句)</button>` : ''}
                        <button onclick="startDictation()" style="padding:15px 30px;font-size:1.2em;background:#4ECDC4;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🔁再做全部</button>
                        <button onclick="initDictation()" style="padding:15px 30px;font-size:1.2em;background:#667eea;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🏠 返去選單</button>
                    </div>
                </div>
            `;
            document.getElementById('dict-hint').textContent = '';
            document.getElementById('dict-encourage').textContent = '';
        }
        
        function reviewDictWrong() {
            if (dictWrongList.length === 0) return;
            dictSentenceList = [...dictWrongList];
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = true;
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';
            renderDictSentence();
        }
    </script>
</body>
