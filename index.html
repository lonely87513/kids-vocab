<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2b2455" media="(prefers-color-scheme: dark)">
    <title>🎮 孖寶學字詞 - 5歲小朋友</title>
    <style>
        /* ============================================================
           設計語彙（CSS 自訂屬性）
           集中管理色彩、圓角、陰影、觸控尺寸，方便日後統一調整。
           ============================================================ */
        :root {
            color-scheme: light dark;

            /* 主色（紫藍） */
            --brand: #667eea;
            --brand-strong: #764ba2;
            --brand-ink: #4a57c9;
            --brand-grad: linear-gradient(135deg, #5b6ee0, #6a4bb8);
            --brand-grad-soft: linear-gradient(135deg, #667eea, #764ba2);

            /* 文字 */
            --ink: #26243a;
            --ink-soft: #5d5a75;

            /* 介面底色 */
            --surface: #ffffff;
            --surface-2: #f8f8fc;
            --surface-3: #f0f0f6;
            --field-bg: #ffffff;
            --line: #dcdcec;

            /* 語意色（維持原有配色語意） */
            --yellow: #FFE66D;
            --yellow-strong: #FFD93D;
            --mint: #4ECDC4;
            --mint-soft: #95E1D3;
            --red: #E8504D;
            --red-soft: #FF6B6B;
            --gold: #F7DC6F;

            /* 圓角與陰影 */
            --r-sm: 12px;
            --r-md: 18px;
            --r-lg: 28px;
            --r-pill: 999px;
            --sh-1: 0 2px 6px rgba(31,26,73,.10);
            --sh-2: 0 6px 16px rgba(31,26,73,.14);
            --sh-3: 0 14px 36px rgba(31,26,73,.20);
            --sh-brand: 0 8px 20px rgba(102,126,234,.32);

            /* 觸控最小尺寸與鍵盤焦點圈 */
            --tap: 44px;
            --focus: #ffd166;
        }

        /* ============================================================
           基礎重設與流體字級
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Microsoft JhengHei", "PingFang HK", sans-serif; }
        /* 以根字級配合 clamp() 令整體版面隨螢幕寬度平滑縮放 */
        html { font-size: clamp(15px, 14.2px + 0.25vw, 18px); -webkit-text-size-adjust: 100%; }
        /* 停用觸控縮放與雙擊縮放 */
        html, body { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            /* iPhone 瀏海與圓角安全區 */
            padding: max(1.25rem, calc(env(safe-area-inset-top, 0px) + 0.75rem))
                     max(1.25rem, calc(env(safe-area-inset-right, 0px) + 0.75rem))
                     max(1.25rem, calc(env(safe-area-inset-bottom, 0px) + 0.75rem))
                     max(1.25rem, calc(env(safe-area-inset-left, 0px) + 0.75rem));
            touch-action: manipulation;
        }
        .container { width: 100%; max-width: 1120px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; font-size: clamp(1.9rem, 1.35rem + 2.2vw, 3rem); margin-bottom: clamp(0.75rem, 1.6vw, 1.5rem); text-shadow: 0 3px 10px rgba(0,0,0,.35); }
        h2 { font-size: clamp(1.25rem, 1.05rem + 0.9vw, 1.75rem); line-height: 1.35; }

        /* 鍵盤操作時的焦點圈（滑鼠點擊不顯示） */
        :where(button, input, [tabindex]):focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        /* ============================================================
           主選單
           ============================================================ */
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: clamp(0.65rem, 1.2vw, 1.1rem); justify-items: stretch; margin-bottom: clamp(1.1rem, 2.2vw, 2rem); }
        .menu-btn {
            width: 100%;
            min-height: var(--tap);
            padding: clamp(0.8rem, 1.4vw, 1.25rem) clamp(1rem, 2vw, 2.5rem);
            font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.45rem);
            font-weight: 700;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,.2), var(--sh-2);
        }
        .menu-btn:hover { transform: translateY(-3px); filter: brightness(1.04); box-shadow: 0 9px 0 rgba(0,0,0,.18), var(--sh-3); }
        .menu-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
        .btn-flashcards { background: var(--red-soft); color: #fff; }
        .btn-quiz { background: var(--mint); color: #0b3b34; }
        .btn-matching { background: var(--yellow); color: #333; }
        .btn-add { background: var(--mint-soft); color: #333; }
        .btn-dictation { background: var(--gold); color: #333; }

        /* ============================================================
           遊戲區塊
           ============================================================ */
        .game-area {
            background: var(--surface);
            color: var(--ink);
            border-radius: var(--r-lg);
            padding: clamp(1.1rem, 2.2vw, 2rem);
            box-shadow: var(--sh-3);
            border: 1px solid rgba(255,255,255,.45);
            display: none;
        }
        .game-area.active { display: block; animation: areaIn .3s ease both; }
        @keyframes areaIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        /* ============================================================
           認字卡
           ============================================================ */
        .card-container { display: flex; flex-wrap: wrap; gap: clamp(1rem, 2vw, 1.75rem); justify-content: center; margin: clamp(1.25rem, 2.4vw, 2rem) 0; }
        .card {
            position: relative;
            width: clamp(9rem, 26vw, 15rem);
            aspect-ratio: 5 / 6;
            height: auto;
            min-height: 0;
            border-radius: var(--r-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,.7);
            box-shadow: var(--sh-2);
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .card:hover { transform: translateY(-6px) rotate(-0.6deg); box-shadow: var(--sh-3); }
        .card:active { transform: translateY(-1px) scale(.98); }
        .card-front { background: linear-gradient(145deg, #FF9A9E, #FECFEF); font-size: 4em; }
        /* 類別未有字詞時的提示卡：單獨一張卡時改為可自由增高，避免文字溢出 */
        .card-container > .card:only-child {
            font-size: 1.15em;
            line-height: 1.5;
            aspect-ratio: auto;
            min-height: 11rem;
            height: auto;
            padding: 1.75rem 1.5rem !important;
            color: #5f5a6b !important;
        }
        .card-back {
            background: linear-gradient(145deg, #A8EDEA, #FED6E3);
            font-size: 2em;
            color: #333;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .word-row { display: flex; align-items: center; justify-content: center; }
        .word-text { font-size: 1.5em; font-weight: 800; color: #2f2c3f; letter-spacing: .02em; }
        .word-english { font-size: .8em; color: #5d5a75; font-weight: 600; }

        /* ============================================================
           進度條
           ============================================================ */
        .progress-bar {
            width: 100%;
            height: clamp(1.8rem, 1.5rem + 1vw, 2.4rem);
            background: var(--surface-3);
            border-radius: var(--r-pill);
            overflow: hidden;
            margin: clamp(1rem, 2vw, 1.5rem) 0;
            border: 1px solid var(--line);
            box-shadow: inset 0 2px 6px rgba(31,26,73,.12);
        }
        .progress-fill {
            height: 100%;
            min-width: 3.4rem;
            background: linear-gradient(90deg, #5b6ee0, #764ba2);
            border-radius: var(--r-pill);
            transition: width .5s cubic-bezier(.22,.9,.3,1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: .88em;
            text-shadow: 0 1px 2px rgba(0,0,0,.35);
            white-space: nowrap;
        }

        /* ============================================================
           返回按鈕與其他按鈕
           ============================================================ */
        .back-btn {
            min-height: var(--tap);
            padding: clamp(0.7rem, 1.1vw, 1rem) clamp(1.1rem, 2vw, 1.9rem);
            font-size: clamp(1rem, 0.92rem + 0.4vw, 1.2rem);
            font-weight: 700;
            border: none;
            border-radius: var(--r-sm);
            background: var(--brand-grad);
            color: #fff;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 4px 12px rgba(102,126,234,.28);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(102,126,234,.34); filter: brightness(1.04); }
        .back-btn:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(102,126,234,.24); }
        .back-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; filter: none; }

        .quiz-speak-btn {
            min-height: var(--tap);
            padding: .7rem 1.2rem;
            font-size: clamp(1rem, 0.95rem + 0.35vw, 1.2rem);
            font-weight: 700;
            border: none;
            border-radius: var(--r-md);
            background: var(--yellow);
            color: #333;
            cursor: pointer;
            margin-top: .75rem;
            box-shadow: var(--sh-1);
            transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        }
        .quiz-speak-btn:hover { background: var(--yellow-strong); transform: translateY(-2px); box-shadow: var(--sh-2); }
        .quiz-speak-btn:active { transform: translateY(1px); }

        .speak-btn {
            background: var(--brand-grad);
            color: white;
            border: none;
            border-radius: 50%;
            width: var(--tap);
            height: var(--tap);
            min-width: var(--tap);
            min-height: var(--tap);
            font-size: 1.15em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
            flex-shrink: 0;
            box-shadow: var(--sh-1);
        }
        .speak-btn:hover { transform: scale(1.08); background: var(--brand-strong); box-shadow: var(--sh-2); }
        .speak-btn:active { transform: scale(.96); }

        /* ============================================================
           分類標籤（sticky + 窄屏橫向捲動 + 闊屏平均分佈）
           ============================================================ */
        .category-tabs {
            position: sticky;
            top: calc(env(safe-area-inset-top, 0px) + .5rem);
            z-index: 30;
            display: flex;
            gap: .55rem;
            justify-content: flex-start;
            margin: 0 0 1.1rem;
            padding: .55rem .4rem .7rem;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scroll-snap-type: x proximity;
            background: var(--surface);
            background: color-mix(in srgb, var(--surface) 88%, transparent);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: var(--r-md);
            border: 1px solid var(--line);
            box-shadow: var(--sh-1);
        }
        .category-tabs::-webkit-scrollbar { height: 6px; }
        .category-tabs::-webkit-scrollbar-thumb { background: rgba(120,120,160,.35); border-radius: var(--r-pill); }
        .category-tab {
            flex: 0 0 auto;
            min-height: var(--tap);
            padding: .55rem 1.05rem;
            border: 2px solid transparent;
            border-radius: var(--r-pill);
            cursor: pointer;
            font-size: clamp(.95rem, .9rem + .25vw, 1.1rem);
            font-weight: 600;
            background: var(--surface-3);
            color: var(--ink);
            scroll-snap-align: center;
            box-shadow: var(--sh-1);
            transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .category-tab:hover { background: var(--brand-grad-soft); color: #fff; transform: translateY(-2px); }
        .category-tab.active {
            background: var(--brand-grad);
            color: #fff;
            border-color: rgba(255,255,255,.7);
            box-shadow: var(--sh-brand);
            transform: translateY(-1px);
        }
        .category-tab:active { transform: translateY(0) scale(.98); }

        /* ============================================================
           分數、圖示與鼓勵文字
           ============================================================ */
        .score { font-size: clamp(1.25rem, 1.05rem + 0.7vw, 1.65rem); font-weight: 700; text-align: center; margin: 1rem 0; }
        .emoji { font-size: clamp(3rem, 2rem + 4vw, 5.5rem); text-align: center; line-height: 1.15; }
        .encourage { font-size: clamp(1.35rem, 1.1rem + 0.9vw, 2rem); font-weight: 700; text-align: center; color: var(--brand-ink); margin: 1.2rem 0; min-height: 1.4em; }

        /* ============================================================
           估估吓選項（窄屏一列、闊屏 2×2）
           ============================================================ */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(.7rem, 1.2vw, 1rem);
            width: 100%;
            max-width: 46rem;
            margin: 0 auto;
        }
        .option-btn {
            min-height: calc(var(--tap) + .5rem);
            padding: clamp(.8rem, 1.3vw, 1.2rem) clamp(1rem, 1.8vw, 1.6rem);
            font-size: clamp(1.1rem, 1rem + 0.55vw, 1.5rem);
            font-weight: 700;
            border: 2px solid var(--line);
            border-radius: var(--r-md);
            cursor: pointer;
            background: var(--surface-3);
            color: var(--ink);
            text-align: center;
            box-shadow: var(--sh-1);
            transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
        }
        .option-btn:hover { background: var(--brand-grad-soft); color: #fff; transform: translateY(-3px); box-shadow: var(--sh-2); }
        .option-btn:active { transform: translateY(1px); }
        .option-btn.correct { background: var(--mint) !important; color: #0b3b34 !important; border-color: transparent; }
        .option-btn.wrong { background: var(--red) !important; color: #fff !important; border-color: transparent; }
        .option-btn:disabled { cursor: default; opacity: .85; transform: none; }
        /* 讀默開始按鈕與讀音按鈕所屬的容器行需跨欄置中 */
        .options > .back-btn { grid-column: 1 / -1; justify-self: center; }
        .options > div { grid-column: 1 / -1; }

        /* ============================================================
           配對遊戲
           ============================================================ */
        .matching-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(.65rem, 1.3vw, 1rem);
            max-width: 46rem;
            margin: 0 auto;
        }
        .matching-card {
            aspect-ratio: 1;
            min-height: var(--tap);
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: .4rem;
            font-size: clamp(1.05rem, .95rem + .5vw, 1.5rem);
            font-weight: 700;
            color: #2f2c3f;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: var(--sh-1);
            transition: transform .25s ease, box-shadow .25s ease, opacity .35s ease, border-color .2s ease;
        }
        .matching-card:hover { transform: translateY(-3px) scale(1.03); box-shadow: var(--sh-2); }
        .matching-card.selected { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(102,126,234,.28), var(--sh-2); transform: scale(1.05); }
        .matching-card.matched { opacity: 0; pointer-events: none; transform: scale(.85); }

        /* ============================================================
           加字詞表單
           ============================================================ */
        .add-word-form { display: flex; flex-direction: column; gap: clamp(.65rem, 1.1vw, .9rem); max-width: 26rem; margin: 0 auto; }
        .add-word-form input {
            min-height: var(--tap);
            padding: .8rem 1rem;
            font-size: clamp(1rem, .95rem + .25vw, 1.2rem);
            border: 2px solid var(--line);
            border-radius: var(--r-sm);
            background: var(--field-bg);
            color: var(--ink);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .add-word-form input::placeholder { color: var(--ink-soft); opacity: 1; }
        .add-word-form input:focus-visible { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(102,126,234,.22); outline: none; }
        .add-word-form button {
            min-height: var(--tap);
            padding: .85rem 1rem;
            font-size: clamp(1.05rem, 1rem + 0.3vw, 1.3rem);
            font-weight: 700;
            border: none;
            border-radius: var(--r-sm);
            background: var(--mint);
            color: #0b3b34;
            cursor: pointer;
            box-shadow: var(--sh-1);
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }
        .add-word-form button:hover { transform: translateY(-2px); box-shadow: var(--sh-2); filter: brightness(1.05); }
        .add-word-form button:active { transform: translateY(1px); }

        /* ============================================================
           題目數量滑桿
           ============================================================ */
        .quantity-control {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            padding: clamp(.9rem, 1.5vw, 1.25rem) clamp(1rem, 1.8vw, 1.5rem);
            margin: 1rem auto;
            max-width: 28rem;
        }
        .quantity-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .6rem;
            font-size: clamp(1rem, .95rem + .3vw, 1.2rem);
            font-weight: 700;
            color: var(--brand-ink);
        }
        .quantity-slider {
            width: 100%;
            height: 18px;
            margin: .25rem 0 .85rem;
            border-radius: var(--r-pill);
            background: linear-gradient(90deg, #5b6ee0 0%, #764ba2 100%);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .quantity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--brand);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .quantity-slider::-moz-range-thumb {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--brand);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }

        /* ============================================================
           完成提示視窗
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-left, 0px));
            animation: modalFadeIn 0.3s ease both;
        }
        .modal-content {
            background: var(--surface);
            color: var(--ink);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
            max-width: 90vw;
            animation: modalPopIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalPopIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ============================================================
           平板與桌面版
           ============================================================ */
        @media (min-width: 620px) {
            /* 闊屏選項改為 2×2 排列 */
            .options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            /* 配對卡回到四欄並放大 */
            .matching-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }

        @media (min-width: 900px) {
            /* 闊屏分類標籤平均分佈（可換行、不再需要橫向捲動） */
            .category-tabs {
                flex-wrap: wrap;
                justify-content: center;
                overflow-x: visible;
                scroll-snap-type: none;
                padding: .7rem .8rem .85rem;
            }
            .category-tab { flex: 0 1 auto; }
        }

        @media (min-width: 1024px) {
            .container { max-width: 1120px; }
            .game-area { padding: 2rem 2.25rem; }
        }

        /* ============================================================
           手機版（保持原有易用性並收窄版面）
           ============================================================ */
        @media (max-width: 600px) {
            body {
                padding: max(.75rem, calc(env(safe-area-inset-top, 0px) + .5rem))
                         max(.75rem, calc(env(safe-area-inset-right, 0px) + .5rem))
                         max(.75rem, calc(env(safe-area-inset-bottom, 0px) + .5rem))
                         max(.75rem, calc(env(safe-area-inset-left, 0px) + .5rem));
            }
            h1 { font-size: clamp(1.6rem, 1.3rem + 2vw, 2rem); }
            .menu { gap: .55rem; margin-bottom: 1rem; }
            .menu-btn { padding: .8rem 1rem; font-size: 1.05rem; }
            .game-area { padding: 1rem; border-radius: 20px; }
            .card { width: min(8.5rem, 40vw); }
            .option-btn { font-size: 1.1rem; }
            .add-word-form input { font-size: 1rem; }
            .add-word-form button { font-size: 1.1rem; }
            .back-btn { padding: .7rem 1.1rem; font-size: 1rem; }
        }

        /* ============================================================

    <script>
        // Helper: Ensure voices are loaded before speaking (fixes Android)
        // Pre-load voices on page load (Android Chrome workaround)
        function preloadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Force multiple loads for Android
            setTimeout(() => window.speechSynthesis.getVoices(), 100);
            setTimeout(() => window.speechSynthesis.getVoices(), 300);
            setTimeout(() => window.speechSynthesis.getVoices(), 600);
            // Defer so the voice-scoring constants below are initialised first
            if (voices && voices.length > 0) setTimeout(() => dumpTTSVoices(voices), 0);
        }

        // Diagnostics: one-line summary of the voices this browser exposes, so
        // a strange pronunciation can be diagnosed from the console alone.
        // Run `dumpTTSVoices()` in the console at any time to reprint it.
        function dumpTTSVoices(voices) {
            try {
                const list = voices || (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
                if (!list || list.length === 0) return;
                const en = list.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
                const zh = list.filter(v => /^(yue|zh|cmn)/i.test((v.lang || '').toLowerCase()));
                const pickEn = pickBestEnglishVoice(list);
                const pickZh = pickBestChineseVoice(list);
                console.info('[TTS] English voices: ' + (en.map(v => `${v.name} | ${v.lang}`).join(' / ') || 'none'));
                console.info('[TTS] Chinese voices: ' + (zh.map(v => `${v.name} | ${v.lang}`).join(' / ') || 'none'));
                console.info('[TTS] Picked → EN: ' + (pickEn ? `${pickEn.name} | ${pickEn.lang}` : 'device default')
                    + '  |  ZH: ' + (pickZh ? `${pickZh.name} | ${pickZh.lang}` : 'device default'));
                window.__ttsLogged = true;
            } catch (e) {
                console.warn('dumpTTSVoices failed:', e);
            }
        }
        window.dumpTTSVoices = dumpTTSVoices;
        // Try to load voices early
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = preloadVoices;
            preloadVoices();
        }

        function ensureVoicesLoaded() {
            return new Promise((resolve) => {
                let voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    resolve(voices);
                    return;
                }
                // Android Chrome workaround: wait for voiceschanged
                const onVoicesChanged = () => {
                    voices = window.speechSynthesis.getVoices();
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoicesChanged);
                    resolve(voices);
                };
                window.speechSynthesis.addEventListener('voiceschanged', onVoicesChanged);
                // Fallback timeout for Android (longer)
                setTimeout(() => {
                    window.speechSynthesis.removeEventListener('voiceschanged', onVoicesChanged);
                    resolve(window.speechSynthesis.getVoices());
                }, 1000);
            });
        }

        // Pick the best available Chinese voice from a list, preferring Cantonese.
        // Returns null if nothing Chinese-shaped is found, so the caller can let
        // the SpeechSynthesisUtterance fall back to the device default language
        // (which is normally correct on the user's own phone anyway).
        //
        // Within the same language family we now SCORE the candidates instead of
        // taking the first one: macOS ships three older Cantonese voices
        // (善怡 Sin-ji / 李慕 Li-mu / 雲龍 Wan-lung) plus the newer, clearly
        // more natural 美佳 Meijia ("Premium"). Taking "the first yue-HK voice"
        // frequently landed on 善怡, which is the weakest of them.
        const CHINESE_VOICE_PREFERRED_NAME = /美佳|meijia|premium|進階|enhanced/i;
        const CHINESE_VOICE_LEGACY_NAME = /善怡|sin-ji|sinji|李慕|li-mu|limu|雲龍|wan-lung|wanlung/i;
        function scoreChineseVoice(v) {
            const name = v.name || '';
            let s = 0;
            if (CHINESE_VOICE_PREFERRED_NAME.test(name)) s += 60;
            if (CHINESE_VOICE_LEGACY_NAME.test(name)) s -= 25;
            if (v.localService) s += 5;
            return s;
        }
        function pickBestChineseVoice(voices) {
            if (!voices || voices.length === 0) return null;
            const lc = v => (v.lang || '').toLowerCase();
            // Priority order: Cantonese first, then traditional/simplified Chinese variants
            const priorities = ['yue', 'zh-hk', 'zh-hant', 'zh-tw', 'zh-cn', 'zh', 'cmn'];
            for (const code of priorities) {
                const matches = voices.filter(v => lc(v).startsWith(code) || lc(v).includes('-' + code));
                if (matches.length === 0) continue;
                // Same language family → pick the best-scoring voice inside it.
                return matches
                    .map(v => ({ v, s: scoreChineseVoice(v) }))
                    .sort((a, b) => b.s - a.s)[0].v;
            }
            return null;
        }

        // Pick the best available English voice.
        //
        // Why this exists (2026-11-07): the previous implementation used
        // voices.find(v => v.lang.startsWith('en')), i.e. the FIRST English
        // voice in the OS list, with no quality filter. On desktop that is
        // often a novelty/legacy engine (macOS ships "Fred", "Albert",
        // "Zarvox"…; Windows ships compact/eSpeak voices; Chrome's network
        // voice falls back to a robotic local voice when the network hiccups)
        // → the kid hears a "weird" pronunciation. Mobile only exposes 1-2
        // high-quality neural voices, which is why the phone was fine and the
        // PC was not.
        //
        // Strategy: ban the known-bad engines, then prefer a natural/premium
        // voice, then a known-good name, then the wanted locale (en-US by
        // default), and only then any remaining English voice.
        const ENGLISH_VOICE_BAD_NAME = /albert|bahh|bells|boing|cellos|deranged|bad news|good news|jester|junior|kathy|pipe organ|trinoids|wobble|zarvox|ralph|vicky|bubbles|festival|compact|espeak|eloquence|robot/i;
        const ENGLISH_VOICE_GOOD_NAME = /natural|premium|enhanced|neural|siri|google|samantha|alex|ava|evan|daniel|karen|moira|aria|jenny|guy|david|zira|libby|sara|mark|natalie|ellen|rishi|sonia|tom|serena/i;
        const ENGLISH_VOICE_LOCALE = 'en-US';
        function pickBestEnglishVoice(voices) {
            if (!voices || voices.length === 0) return null;
            const lc = v => (v.lang || '').toLowerCase();
            const candidates = voices.filter(v => lc(v).startsWith('en'));
            if (candidates.length === 0) return null;

            const score = v => {
                const name = v.name || '';
                if (ENGLISH_VOICE_BAD_NAME.test(name)) return -1000;
                let s = 0;
                if (ENGLISH_VOICE_GOOD_NAME.test(name)) s += 60;
                if (lc(v).startsWith(ENGLISH_VOICE_LOCALE.toLowerCase())) s += 40;
                else if (lc(v).startsWith('en-gb')) s += 20;
                else if (lc(v).startsWith('en')) s += 10;
                // Prefer a local voice: a network voice can silently fail and
                // fall back to a robotic one (that was the "sometimes weird"
                // symptom on desktop).
                if (v.localService) s += 10;
                return s;
            };

            return candidates
                .map(v => ({ v, s: score(v) }))
                .sort((a, b) => b.s - a.s)[0].v;

        // ========== Custom Words Persistence (M1) ==========
        // User-added words survive page reload via localStorage.
        // On reload we re-merge them into the in-memory vocabulary so each
        // game (flashcards, quiz, matching, dictation) sees the latest set.
        const CUSTOM_WORDS_KEY = 'kidsVocab_customWords';
        let customWords = [];

        function loadCustomWords() {
            try {
                const stored = localStorage.getItem(CUSTOM_WORDS_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) customWords = parsed;
                }
            } catch (e) {
                console.warn('Failed to load custom words:', e);
                customWords = [];
            }
        }

        function saveCustomWords() {
            try {
                localStorage.setItem(CUSTOM_WORDS_KEY, JSON.stringify(customWords));
            } catch (e) {
                console.warn('Failed to save custom words:', e);
            }
        }

        function resetCustomWords() {
            customWords = [];
            try { localStorage.removeItem(CUSTOM_WORDS_KEY); } catch (e) {}
            location.reload();
        }

        function applyCustomWords() {
            for (const word of customWords) {
                if (!word || !word.category || !word.chinese) continue;
                if (!vocabulary[word.category]) vocabulary[word.category] = [];
                if (!vocabulary[word.category].some(w => w.chinese === word.chinese)) {
                    vocabulary[word.category].push({
                        chinese: word.chinese,
                        emoji: word.emoji || '',
                        english: word.english || ''
                    });
                }
            }
        }

        // Load + merge custom words before any game init runs.
        loadCustomWords();
        applyCustomWords();

        // Game state
        let currentCategory = '📚 K2第二段中文';
        let currentCard = 0;
        let quizScore = 0;
        // M2: matching score is tracked per-category so switching category
        // starts fresh instead of carrying the previous score over.
        const matchStates = {};

        function getMatchState() {
            if (!matchStates[currentCategory]) {
                matchStates[currentCategory] = { score: 0 };
            }
            return matchStates[currentCategory];
        }

        let quizWords = [];
        let flashcardWords = [];
        let selectedMatch = null;
        let showEmoji = true;
        let quizQuantity = 10; // Default 10 questions
        let fcQuantity = 10; // Flashcards quantity
        // Flashcard quiz tracking

        // Shuffle function
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Show game
        function showGame(game) {
            document.querySelectorAll('.game-area').forEach(el => el.classList.remove('active'));
            document.getElementById(game).classList.add('active');
            if (game === 'flashcards') initFlashcards();
            if (game === 'quiz') initQuiz();
            if (game === 'matching') initMatching();
            if (game === 'dictation') initDictation();
        }

        // Escape HTML special characters to prevent XSS via user-controlled strings.
        // Use this BEFORE any concatenation into innerHTML or attribute values that
        // originate from addWord inputs, category names, or other user-provided data.
        function escapeHtml(s) {
            if (s == null) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getCategories() { return Object.keys(vocabulary); }

        // Learning-category helpers - single source of truth for the
        // "is this category one of the K2 / K3 第二段・第三段 中文/英文 sets?"
        // check that used to be duplicated inline in 7 places. Returns
        // true/false for category-name strings (or falsy input).
        //
        // Design note (2026-11-07): these checks are grade-agnostic on purpose.
        // A category counts as a "learning category" when its name carries a
        // grade token (K1 / K2 / K3 ...), optionally followed by 第X段. Adding a
        // new grade set (e.g. "📚 K3第二段中文" / "🅰️ K3第三段英文") therefore
        // needs NO code change - the new category automatically inherits the
        // quantity slider, the Chinese-character flashcard front, the TTS
        // read-aloud and the matching game behaviour.
        const LEARNING_CATEGORY_RE = /(?:^|[^A-Za-z0-9])K[0-9]+/;
        function isLearningCategory(cat) {
            if (!cat) return false;
            return LEARNING_CATEGORY_RE.test(cat);
        }
        function isEnglishCategory(cat) {
            if (!cat) return false;
            return isLearningCategory(cat) && cat.includes('英文');
        }
        function isChineseCategory(cat) {
            if (!cat) return false;
            return isLearningCategory(cat) && cat.includes('中文');
        }

        // Backward-compatible wrappers for the old K2-specific names (kept so
        // any custom-word / console flow that still calls them keeps working).
        // They delegate to the generic helpers above while preserving the EXACT
        // original semantics, so no existing behaviour changes.
        function isK2Category(cat) {
            if (!cat) return false;
            return isLearningCategory(cat) && (cat.includes('K2第二段') || cat.includes('K2第三段'));
        }
        function isK2English(cat) {
            if (!cat) return false;
            return isEnglishCategory(cat) && (cat.includes('K2第二段英文') || cat.includes('K2第三段英文'));
        }
        function isK2Chinese(cat) {
            if (!cat) return false;
            return isChineseCategory(cat) && (cat.includes('K2第二段中文') || cat.includes('K2第三段中文'));
        }

        // Flashcards
        function initFlashcards() {
            const fcTabs = document.getElementById('fc-tabs');
            fcTabs.innerHTML = '';
            getCategories().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (cat === currentCategory ? ' active' : '');
                btn.dataset.category = cat;
                btn.textContent = cat;  // safe: textContent escapes HTML
                btn.addEventListener('click', () => switchCategory(cat));
                fcTabs.appendChild(btn);
            });

            // Reset score display
            document.getElementById('fc-score').textContent = '✅ 0 | ❌ 0';
            document.getElementById('fc-buttons').style.display = 'block';
            document.getElementById('fc-review-btn').style.display = 'none';

            // Check if showing quantity control
            const isLearningCat = isLearningCategory(currentCategory);
            document.getElementById('fc-quantity-control').style.display = isLearningCat ? 'block' : 'none';

            // Show quantity slider only for learning categories
            if (isLearningCat) {
                const availableWords = vocabulary[currentCategory].length;
                const slider = document.getElementById('fc-quantity-slider');
                slider.max = Math.min(100, Math.max(1, availableWords));  // slider min=1, avoid 0
                if (fcQuantity > availableWords) fcQuantity = availableWords;
                slider.value = fcQuantity;
                document.getElementById('fc-quantity-display').textContent = `${fcQuantity} 題 / 共 ${availableWords} 題`;

                // Disable start button if no words available (C3 safety)
                const startBtn = document.getElementById('fc-start-btn');
                if (startBtn) {
                    startBtn.disabled = availableWords === 0;
                    startBtn.textContent = availableWords === 0 ? '類別未有字詞' : '✅ 開始 🃏';
                }

                // Hide cards and progress when quantity selector is shown
                document.getElementById('fc-container').innerHTML = '<div style="text-align:center;color:#667eea;font-size:1.5em;padding:50px;">👇 設定題目數量後按「開始」🃏</div>';
                document.getElementById('fc-progress').style.width = '0%';
                document.getElementById('fc-progress').textContent = '0/0';
            } else {
                // For other categories, show all cards
                fcQuantity = vocabulary[currentCategory].length;
                flashcardWords = shuffle([...vocabulary[currentCategory]]);
                currentCard = 0;
                renderCard();
            }

        // Update flashcards quantity
        function updateFcQuantity(value) {
            fcQuantity = parseInt(value);
            const availableWords = vocabulary[currentCategory].length;
            document.getElementById('fc-quantity-display').textContent = `${fcQuantity} 題 / 共 ${availableWords} 題`;

            const startBtn = document.getElementById('fc-start-btn');
            if (startBtn) {
                startBtn.disabled = availableWords === 0;
                startBtn.textContent = availableWords === 0 ? '類別未有字詞' : '✅ 開始 🃏';
            }
        }

        // Start flashcards with selected quantity
        function startFlashcards() {
            const allWords = shuffle([...vocabulary[currentCategory] || []]);
            // M8: clamp fcQuantity into [1, allWords.length] so we never end
            // up with an empty flashcardWords (fcQuantity=0) or accidentally
            // requesting more cards than the category actually has. This is
            // defense-in-depth on top of the slider min=1 and initFlashcards
            // already clamping the slider max.
            const maxAvailable = allWords.length;
            const safeQty = Math.max(1, Math.min(fcQuantity || 10, maxAvailable));
            // Guard: empty category would otherwise break renderCard (C3 defense-in-depth)
            if (maxAvailable === 0) {
                fcStarted = false;
                flashcardWords = [];
                renderCard();  // renderCard() shows the friendly empty state
                return;
            }
            flashcardWords = allWords.slice(0, safeQty);
            currentCard = 0;
            fcCorrect = 0;
            fcWrong = 0;
            fcWrongList = [];
            fcStarted = true;
            document.getElementById('fc-buttons').style.display = 'block';
            document.getElementById('fc-review-btn').style.display = 'none';
            renderCard();
        }

            currentCategory = cat;

        function renderCard() {
            const isEnglish = isEnglishCategory(currentCategory);
            const isChineseLearning = isChineseCategory(currentCategory);

            // Guard (C3): empty flashcardWords (user-created empty category,
            // fcQuantity=0, etc.) would otherwise throw
            //   TypeError: Cannot read properties of undefined (reading 'emoji')
            // Show a friendly empty state instead of crashing the flashcard UI.
            if (!flashcardWords || flashcardWords.length === 0 || !flashcardWords[currentCard]) {

                return;
            }
            const word = flashcardWords[currentCard];

            document.getElementById('fc-progress').style.width = ((currentCard + 1) / flashcardWords.length * 100) + '%';
            document.getElementById('fc-progress').textContent = `${currentCard + 1}/${flashcardWords.length}`;

            // Smaller emoji for learning categories to avoid blocking buttons
            const emojiSize = (isEnglish || isChineseLearning) ? '0.9em' : '4em';

            if (isEnglish) {
                document.getElementById('fc-container').innerHTML = `
                    <div class="card card-front"><div style="font-size:${emojiSize}">${showEmoji ? word.emoji : ""}</div><div style="font-size:1.3em;font-weight:bold;color:#333;margin-top:5px;">${word.chinese}</div></div>
                    <div class="card card-back">
                        <div class="word-row">
                            <span class="word-text">${word.english}</span>
                            <button class="speak-btn" onclick="speakText('${word.english}', 'en')" aria-label="讀英文">🔊</button>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('fc-container').innerHTML = `
                    <div class="card card-front"><div style="font-size:${emojiSize}">${showEmoji ? word.emoji : ""}</div></div>
                    <div class="card card-back">
                        <div class="word-row">
                            <span class="word-text" style="font-size:1.3em">${word.chinese}</span>
                            <button class="speak-btn" onclick="speakText('${word.chinese}', 'zh-HK')" aria-label="讀粵語">🔊</button>
                        </div>
                        <div class="word-english">${word.english}</div>
                    </div>
                `;
            }
        }

        // Speak text function
        // M7: isSpeaking flag prevents rapid emoji clicks from queueing multiple
        // utterances that overlap. The flag is released by onend/onerror so a
        // new speak() call after the current one finishes works normally.
        let isSpeaking = false;

        async function speakText(text, lang) {
            // M7: drop repeated calls while an utterance is still in flight
            if (isSpeaking) return;
            if (!('speechSynthesis' in window)) {
                console.warn('呢部機未支援語音功能 🤷');
                return;
            }
            isSpeaking = true;
            try {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                // Wait for voices to load (fixes Android + iOS Safari)
                const voices = await ensureVoicesLoaded();

                const utterance = new SpeechSynthesisUtterance(text);
                // English read by a low-quality desktop engine sounds worst
                // when slowed down AND pitched up, so English stays slightly
                // faster/flatter while Chinese stays warm and slow.
                const isEnglishUtterance = (lang || '').startsWith('en');
                utterance.rate = isEnglishUtterance ? 0.85 : 0.8; // Slower for kids
                utterance.pitch = isEnglishUtterance ? 1.0 : 1.05; // Slightly higher pitch for friendliness

                // For Chinese, prioritize Cantonese (粵語) over Mandarin
                if (lang === 'zh-HK' || lang === 'zh-CN') {
                    // M6: extract the priority chain into a helper so the same
                    // logic is easy to test and reuse. Returns null if no Chinese
                    // voice exists, in which case the utterance falls back to the
                    // device default language (almost always correct on the
                    // user's own phone) instead of being forced to zh-HK which
                    // Safari iOS would then reject.
                    const chineseVoice = pickBestChineseVoice(voices);
                    if (chineseVoice) {
                        utterance.voice = chineseVoice;
                        utterance.lang = chineseVoice.lang;
                        console.warn('Using voice:', chineseVoice.name, chineseVoice.lang);
                    } else {
                        // No Chinese voice available - let the device decide.
                        // Don't throw an alert; just log so the rest of the UI
                        // continues to work for kids.
                        console.warn('No Chinese voice found; using device default');
                        utterance.lang = 'zh-HK';
                    }
                } else {
                    // For English, pick a QUALITY voice (not just the first
                    // 'en-*' one) — see pickBestEnglishVoice() for why.
                    const englishVoice = pickBestEnglishVoice(voices);
                    if (englishVoice) {
                        utterance.voice = englishVoice;
                        utterance.lang = englishVoice.lang;
                        console.info('Using EN voice:', englishVoice.name, englishVoice.lang);
                    } else {
                        // No English voice installed — let the OS pick one for
                        // the locale instead of forcing a mismatching voice.
                        utterance.lang = ENGLISH_VOICE_LOCALE;
                        console.warn('No English voice found; using device default');
                    }
                }

                // Always release the flag when the utterance finishes (or errors),
                // so the next click can speak again.
                utterance.onend = () => { isSpeaking = false; };
                utterance.onerror = (e) => {
                    console.warn('Speech error:', e && e.error ? e.error : e);
                    isSpeaking = false;
                };

                window.speechSynthesis.speak(utterance);
            } catch(e) {
                console.warn('Speech error:', e);
                isSpeaking = false;
            }
        }

        function markCorrect() {
            if (!fcStarted || currentCard >= flashcardWords.length) return;
            fcCorrect++;
            document.getElementById('fc-score').textContent = `✅ ${fcCorrect} | ❌ ${fcWrong}`;
            goToNextCard();
        }

        function markWrong() {
            if (!fcStarted || currentCard >= flashcardWords.length) return;
            fcWrong++;
            fcWrongList.push(flashcardWords[currentCard]);
            document.getElementById('fc-score').textContent = `✅ ${fcCorrect} | ❌ ${fcWrong}`;
            document.getElementById('fc-review-btn').innerHTML = `📝 查看錯題 (${fcWrong})`;
            goToNextCard();
        }

        function goToNextCard() {
            if (currentCard < flashcardWords.length - 1) {
                currentCard++;
                renderCard();
            } else {
                // Finished all cards
                showFinishScreen();
            }
        }

        function showFinishScreen() {
            const isEnglish = isEnglishCategory(currentCategory);
            const finishMsg = fcWrong === 0
                ? '🎉 全部答啱喇!勁呀!'

                                    <div style="font-size: 2em;">${w.emoji}</div>
                                    <div style="font-size: 1.1em; color: #333;">${isEnglish ? w.english : w.chinese}</div>

                                </div>

            document.getElementById('fc-buttons').style.display = 'none';

            document.getElementById('fc-progress').style.width = '100%';
            document.getElementById('fc-progress').textContent = '完成!';

            document.getElementById('fc-container').innerHTML = `
                <div style="text-align:center;padding:30px;">
                    <div style="font-size:3em;margin-bottom:20px;">${fcWrong === 0 ? '🎉' : '💪'}</div>
                    <div style="font-size:1.5em;color:#667eea;margin-bottom:20px;">${finishMsg}</div>
                    ${wrongCardsHtml}
                    <div style="margin-top:30px;">
                        ${fcWrong > 0 ? `<button onclick="reviewWrongCards()" style="padding:15px 30px;font-size:1.2em;background:#FFE66D;border:none;border-radius:15px;cursor:pointer;color:#333;margin:5px;">🔄 再試一次 (${fcWrong}題)</button>` : ''}
                        <button onclick="startFlashcards()" style="padding:15px 30px;font-size:1.2em;background:#4ECDC4;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🔁再做全部</button>
                        <button onclick="initFlashcards()" style="padding:15px 30px;font-size:1.2em;background:#667eea;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🏠 返去選單</button>
                    </div>
                </div>
            `;
        }

        function reviewWrongCards() {
            if (fcWrongList.length === 0) return;
            flashcardWords = [...fcWrongList];
            currentCard = 0;
            fcCorrect = 0;
            fcWrong = 0;

            document.getElementById('fc-buttons').style.display = 'block';
            document.getElementById('fc-score').style.display = 'block';
            document.getElementById('fc-score').textContent = `✅ 0 | ❌ 0 (溫習錯題)`;

        }

        // Quiz
        function initQuiz() {
            // Show/hide quantity slider based on category
            const isLearningCat = isLearningCategory(currentCategory);
            document.getElementById('quantity-control').style.display = isLearningCat ? 'block' : 'none';

            // Update slider max based on available words
            const availableWords = vocabulary[currentCategory].length;
            const slider = document.getElementById('quantity-slider');

                quizQuantity = availableWords;
                slider.value = quizQuantity;
            }
            document.getElementById('quantity-display').textContent = `${quizQuantity} 題 / 共 ${availableWords} 題`;

            // Render quiz category tabs via DOM API to prevent XSS via category names
            const quizTabs = document.getElementById('quiz-tabs');
            quizTabs.innerHTML = '';
            getCategories().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (cat === currentCategory ? ' active' : '');
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.addEventListener('click', () => switchQuizCategory(cat));
                quizTabs.appendChild(btn);
            });

            // Use quantity limit
            const allWords = shuffle([...vocabulary[currentCategory]]);
            quizWords = allWords.slice(0, quizQuantity);

        // Update quantity from slider
        function updateQuantity(value) {

        function renderQuiz() {
            if (quizWords.length === 0) {
                document.getElementById('quiz-emoji').textContent = '🎊';
                document.getElementById('quiz-prompt').textContent = '完成晒!勁呀!⭐⭐⭐';
                document.getElementById('quiz-options').innerHTML = '';
                setTimeout(() => initQuiz(), 3000);
                return;
            }

            const correct = quizWords.pop();
            let options = [correct];
            const others = vocabulary[currentCategory].filter(w => w !== correct);
            while (options.length < 4 && others.length > 0) {
                const idx = Math.floor(Math.random() * others.length);
                if (!options.includes(others[idx])) options.push(others[idx]);
            }
            options = shuffle(options);

            const isEnglish = isEnglishCategory(currentCategory);
            const isChineseLearning = isChineseCategory(currentCategory);
            const emojiSize = (isEnglish || isChineseLearning) ? '1.2em' : '3em';

            if (isEnglish) {
                document.getElementById('quiz-emoji').innerHTML = `<span style="font-size:${emojiSize}">${correct.emoji}</span>`;
                document.getElementById('quiz-prompt').textContent = 'What is this?';
                document.getElementById('quiz-options').innerHTML = options.map(opt =>
                    `<button class="option-btn" onclick="checkAnswer(this, '${opt.english}', '${correct.english}')">${opt.english}</button>`
                ).join('') +
                `<div style="text-align:center;margin-top:15px"><button class="quiz-speak-btn" onclick="speakText('${correct.english}', 'en')">🔊 聽讀音</button></div>`;
            } else if (isChineseLearning) {
                document.getElementById('quiz-emoji').innerHTML = `<span style="font-size:${emojiSize}">${correct.emoji}</span>`;
                document.getElementById('quiz-prompt').textContent = '呢個係咩字?';
                document.getElementById('quiz-options').innerHTML = options.map(opt =>
                    `<button class="option-btn" onclick="checkAnswer(this, '${opt.chinese}', '${correct.chinese}')">${opt.chinese}</button>`
                ).join('') +
                `<div style="text-align:center;margin-top:15px"><button class="quiz-speak-btn" onclick="speakText('${correct.chinese}', 'zh-HK')">🔊 聽粵語</button></div>`;
            }
        }

        function checkAnswer(btn, ans, correct) {
            if (ans === correct) {
                btn.classList.add('correct');
                quizScore++;
                const total = quizQuantity;
                const current = quizScore;
                document.getElementById('quiz-score').textContent = `⭐ ${current} / ${total}`;
                const encourages = ['勁呀!🎉', '叻叻猪!🐷', '好叻呀!⭐'];
                document.getElementById('quiz-encourage').textContent = encourages[Math.floor(Math.random() * encourages.length)];
                setTimeout(renderQuiz, 1200);
            } else {
                btn.classList.add('wrong');
                const wrongMsg = ['加油呀!💪', '再試吓!😊', '唔緊要!🤗'];
                document.getElementById('quiz-encourage').textContent = wrongMsg[Math.floor(Math.random() * wrongMsg.length)];
            }
        }

        // Matching
        function initMatching() {
            // M2: reset per-category score at the start of each matching session.
            // initMatching() is also called when the user switches category, which
            // naturally clears the previous score without us needing a manual reset.
            matchStates[currentCategory] = { score: 0 };

            // Render match category tabs via DOM API to prevent XSS via category names
            const matchTabs = document.getElementById('match-tabs');
            matchTabs.innerHTML = '';
            getCategories().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (cat === currentCategory ? ' active' : '');
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.addEventListener('click', () => {
                    currentCategory = cat;
                    initMatching();
                });
                matchTabs.appendChild(btn);
            });

            const words = shuffle([...vocabulary[currentCategory]]).slice(0, 4);
            const pairs = [];
            const isEnglish = isEnglishCategory(currentCategory);

            words.forEach((w, i) => {
                const text = isEnglish ? w.english : w.chinese;
                const lang = isEnglish ? 'en' : 'zh-HK';

                // Text card
                pairs.push({
                    type: 'text',
                    content: text,
                    id: 'txt' + i,
                    matchId: 'snd' + i,
                    lang: lang
                });
                // Audio card (🔊)
                pairs.push({
                    type: 'audio',
                    content: '🔊',
                    id: 'snd' + i,
                    matchId: 'txt' + i,
                    lang: lang
                });
            });

            const shuffled = shuffle(pairs);
            document.getElementById('match-score').textContent = '⭐ ' + getMatchState().score;
            document.getElementById('match-grid').innerHTML = shuffled.map((p, idx) => {
                const bgColor = p.type === 'text' ? '#FF9A9E' : '#FFE66D';
                const fontSize = p.type === 'text' ? '1.5em' : '3em';
                return `<div class="matching-card" style="background:${bgColor};font-size:${fontSize}"
                     data-id="${p.id}" data-mid="${p.matchId}" data-lang="${p.lang}" onclick="selectMatch(this)">
                     ${p.content}
                </div>`;
            }).join('');
        }

        function selectMatch(card) {
            // Play audio if it's an audio card
            if (card.textContent.trim() === '🔊') {
                const lang = card.dataset.lang;
                // Find the matching text card to get the word
                const textCardId = card.dataset.mid;
                const textCard = document.querySelector(`[data-id="${textCardId}"]`);
                if (textCard) {
                    speakMatchText(textCard.textContent.trim(), lang);
                }
            }

            if (card.classList.contains('matched')) return;
            if (!selectedMatch) {
                selectedMatch = card;
                card.classList.add('selected');
            } else {
                if (selectedMatch.dataset.id === card.dataset.id) {
                    selectedMatch.classList.remove('selected');
                    selectedMatch = null;
                } else if (selectedMatch.dataset.mid === card.dataset.id) {
                    card.classList.add('matched');
                    selectedMatch.classList.add('matched');
                    const state = getMatchState();
                    state.score++;
                    document.getElementById('match-score').textContent = '⭐ ' + state.score;
                    selectedMatch = null;
                    const remaining = document.querySelectorAll('.matching-card:not(.matched)');
                    if (remaining.length === 0) {
                        setTimeout(() => { showCompletionModal(); }, 500);
                    }
                } else {
                    selectedMatch.classList.remove('selected');
                    selectedMatch = card;
                    card.classList.add('selected');
                }
            }
        }

        // Speak text for matching game
        async function speakMatchText(text, lang) {
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    // Wait for voices to load (fixes Android)
                    const voices = await ensureVoicesLoaded();
                    const utterance = new SpeechSynthesisUtterance(text);
                    const isEnglishUtterance = (lang || '').startsWith('en');
                    utterance.rate = isEnglishUtterance ? 0.85 : 0.8;
                    utterance.pitch = isEnglishUtterance ? 1.0 : 1.05;

                    // For Chinese, prioritize Cantonese (粵語)
                    if (lang === 'zh-HK' || lang === 'zh-CN') {
                        const chineseVoice = pickBestChineseVoice(voices);
                        if (chineseVoice) {
                            utterance.voice = chineseVoice;
                            utterance.lang = chineseVoice.lang;
                        } else {
                            utterance.lang = 'zh-HK';
                        }
                    } else {
                        const englishVoice = pickBestEnglishVoice(voices);
                        if (englishVoice) {
                            utterance.voice = englishVoice;
                            utterance.lang = englishVoice.lang;
                        } else {
                            utterance.lang = ENGLISH_VOICE_LOCALE;
                        }
                    }

                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.warn('Speech error:', e);
                }
            }
        }

        // Add word
        function addWord() {
            const cat = document.getElementById('add-category').value.trim();
            const w = document.getElementById('add-word').value.trim();
            const e = document.getElementById('add-emoji').value.trim();
            const en = document.getElementById('add-english').value.trim();
            const result = document.getElementById('add-result');
            if (!cat || !w || !e) {
                // C1: use DOM API (textContent) instead of innerHTML to prevent XSS
                result.innerHTML = '';
                result.textContent = '❌ 要填晒類別、文字、Emoji!';
                return;
            }

            // M1: persist to localStorage so the word survives reload. We also
            // de-dup against existing customWords (same category + chinese) so a
            // user double-clicking add doesn't bloat the stored array.
            if (!customWords.some(cw => cw.category === cat && cw.chinese === w)) {
                customWords.push({ category: cat, chinese: w, emoji: e, english: en });
                saveCustomWords();
            }

            // M1: also de-dup in-memory vocabulary merge in case addWord is called
            // twice before a reload (applyCustomWords reload-merge is already dedup-safe).
            if (!vocabulary[cat]) vocabulary[cat] = [];
            if (!vocabulary[cat].some(item => item.chinese === w)) {
                vocabulary[cat].push({ chinese: w, emoji: e, english: en });
            }

            // C1 fix: render success message via DOM API so user-provided inputs
            // (emoji, chinese, english) are treated as text, not HTML.
            result.innerHTML = '';
            const okLine = document.createElement('div');
            okLine.textContent = '✅ 加入成功!';
            const emojiDiv = document.createElement('div');
            emojiDiv.style.fontSize = '2em';
            emojiDiv.textContent = e;
            const textDiv = document.createElement('div');
            textDiv.textContent = `${w} = ${en}`;
            result.appendChild(okLine);
            result.appendChild(emojiDiv);
            result.appendChild(textDiv);

            ['add-category','add-word','add-emoji','add-english'].forEach(id => document.getElementById(id).value = '');
        }

        // ========== Dictation Game ==========
        const dictationSentences = {
            '📖 Unit 2': [
                { sentence: 'A long time ago, there was an evil and dangerous dragon on a high mountain.', hint: 'dragon, mountain' },
                { sentence: 'At night, it went to the villages, burnt them down and hurt the villagers.', hint: 'night, villages' },
                { sentence: 'Everyone was afraid of it.', hint: 'afraid' },
                { sentence: 'Carlo was a young hunter.', hint: 'young hunter' },

                { sentence: 'He heard some noises. Soon he saw a beautiful white horse with wings!', hint: 'noises, horse' },
                { sentence: 'He rode on it and went on his way.', hint: 'rode' },
                { sentence: 'Later, Carlo met an old woman in the market.', hint: 'market' },
                { sentence: 'She needed some clothes to keep warm.', hint: 'clothes, warm' },
                { sentence: 'Carlo bought her a cape. The old woman was thankful.', hint: 'cape, thankful' },

            ],

                // （三）認讀句子（中文，2026 年度幼高愛班第一段）
                { sentence: '弟弟慢吞吞地吃早餐。', hint: '慢吞吞地、吃早餐' },
                { sentence: '姐姐急匆匆地上學。', hint: '急匆匆地、上學' },
                { sentence: '每天晚上，我先刷牙，然後睡覺。', hint: '先刷牙、然後睡覺' },
                { sentence: '我在8月10日參加跳舞班。', hint: '8月10日、跳舞班' },
                { sentence: '這是一個黃色的環保袋。', hint: '黃色的、環保袋' },
                { sentence: '夏天天氣炎熱。', hint: '天氣、炎熱' },
                { sentence: '我們要減少使用膠樽。', hint: '使用、膠樽' }
