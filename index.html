        function getDictCategories() { return Object.keys(dictationSentences); }

        function initDictation() {
            // Render dict category tabs via DOM API to prevent XSS via category names
            const dictTabs = document.getElementById('dict-tabs');
            dictTabs.innerHTML = '';
            getDictCategories().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-tab' + (cat === dictCategory ? ' active' : '');
                btn.dataset.category = cat;
                btn.textContent = cat;
                btn.addEventListener('click', () => switchDictCategory(cat));
                dictTabs.appendChild(btn);
            });

            // Show quantity control
            document.getElementById('dict-quantity-control').style.display = 'block';
            const availableSents = dictationSentences[dictCategory].length;
            document.getElementById('dict-quantity-slider').max = Math.min(20, availableSents);
            if (dictQuantity > availableSents) dictQuantity = availableSents;
            document.getElementById('dict-quantity-slider').value = dictQuantity;
            document.getElementById('dict-quantity-display').textContent = `${dictQuantity} 題 / 共 ${availableSents} 題`;

            // Show sentence list before starting
            document.getElementById('dict-score').textContent = '✅ 0 | ❌ 0';
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';

            const allSents = shuffle([...dictationSentences[dictCategory]]);
            dictSentenceList = allSents.slice(0, dictQuantity);
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = false;

            // Show preview
            document.getElementById('dict-sentence').innerHTML = `
                <div style="font-size: 1.1em; color: #667eea; margin-bottom: 15px;">📖 ${dictCategory}</div>
                <div style="font-size: 1em; color: #888;">共 ${dictSentenceList.length} 句</div>
            `;
            document.getElementById('dict-hint').textContent = '';
            document.getElementById('dict-options').innerHTML = `
                <button class="back-btn" style="background: #F7DC6F; font-size: 1.5em; padding: 20px 40px; color: #333;" onclick="startDictation()">▶️ 開始讀默</button>
            `;
            document.getElementById('dict-encourage').textContent = '';
            document.getElementById('dict-progress').style.width = '0%';
            document.getElementById('dict-progress').textContent = '0/0';
        }

        function updateDictQuantity(value) {
            dictQuantity = parseInt(value);
            const availableSents = dictationSentences[dictCategory].length;
            document.getElementById('dict-quantity-display').textContent = `${dictQuantity} 題 / 共 ${availableSents} 題`;
        }

        function switchDictCategory(cat) {
            dictCategory = cat;
            dictQuantity = Math.min(5, dictationSentences[cat].length);
            initDictation();
        }

        function startDictation() {
            const allSents = shuffle([...dictationSentences[dictCategory]]);
            dictSentenceList = allSents.slice(0, dictQuantity);
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = true;
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';
            renderDictSentence();
        }

        function renderDictSentence() {
            if (dictCurrent >= dictSentenceList.length) {
                showDictFinish();
                return;
            }

            const item = dictSentenceList[dictCurrent];
            document.getElementById('dict-progress').style.width = ((dictCurrent + 1) / dictSentenceList.length * 100) + '%';
            document.getElementById('dict-progress').textContent = `${dictCurrent + 1}/${dictSentenceList.length}`;
            document.getElementById('dict-score').textContent = `✅ ${dictCorrect} | ❌ ${dictWrong}`;

            // Show hint (partial sentence)
            document.getElementById('dict-hint').textContent = `💡 提示:${item.hint}`;

            // Hide the actual sentence and show blanks (one "___" per word so the
            // visual gap matches the real sentence length). For Chinese there
            // are no spaces, so blank per character instead.
            const isCJK = s => /[\u3400-\u9fff\uf900-\ufaff]/.test(s);
            const placeholder = item.sentence.split(' ').map(token => {
                if (!isCJK(token)) return '___';
                return [...token].map(ch => (isCJK(ch) ? '＿' : ch)).join('');
            }).join(' ');
            document.getElementById('dict-sentence').innerHTML = `
                <div style="font-size: 1.2em; color: #667eea; line-height: 1.8;">
                    <span style="background: #f0f0f0; padding: 5px 15px; border-radius: 10px;">${placeholder}</span>
                </div>
            `;

            // Play sentence automatically
            setTimeout(() => playDictSentence(), 500);

            // Generate options (correct + 3 wrong)
            const allSents = dictationSentences[dictCategory];
            const wrongOptions = allSents.filter(s => s.sentence !== item.sentence);
            const shuffledWrong = shuffle(wrongOptions).slice(0, 3);
            let options = [item, ...shuffledWrong];
            options = shuffle(options);

            document.getElementById('dict-options').innerHTML = options.map(opt =>
                `<button class="option-btn" style="font-size: 1.1em; padding: 15px 20px;" onclick="checkDictAnswer(this, '${opt.sentence.replace(/'/g, "\\'")}', '${item.sentence.replace(/'/g, "\\'")}')">${opt.sentence.substring(0, 50)}...</button>`
            ).join('');

            document.getElementById('dict-encourage').textContent = '';
        }

        async function playDictSentence() {
            if (dictCurrent >= dictSentenceList.length) return;
            const text = dictSentenceList[dictCurrent].sentence;

            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const voices = await ensureVoicesLoaded();
                    const utterance = new SpeechSynthesisUtterance(text);
                    const isChineseSentence = /[\u3400-\u9fff\uf900-\ufaff]/.test(text);
                    utterance.rate = isChineseSentence ? 0.8 : 0.85;
                    utterance.pitch = isChineseSentence ? 1.05 : 1.0;

                    if (isChineseSentence) {
                        // Chinese sentence → Cantonese voice
                        const chineseVoice = pickBestChineseVoice(voices);
                        if (chineseVoice) {
                            utterance.voice = chineseVoice;
                            utterance.lang = chineseVoice.lang;
                            console.info('Using ZH voice:', chineseVoice.name, chineseVoice.lang);
                        } else {
                            utterance.lang = 'zh-HK';
                        }
                    } else {
                        const englishVoice = pickBestEnglishVoice(voices);
                        if (englishVoice) {
                            utterance.voice = englishVoice;
                            utterance.lang = englishVoice.lang;
                            console.info('Using EN voice:', englishVoice.name, englishVoice.lang);
                        } else {
                            utterance.lang = ENGLISH_VOICE_LOCALE;
                        }
                    }

                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.warn('Speech error:', e);
                }
            }
        }

        function checkDictAnswer(btn, ans, correct) {
            // Disable all buttons
            document.querySelectorAll('#dict-options .option-btn').forEach(b => b.disabled = true);

            if (ans === correct) {
                btn.classList.add('correct');
                dictCorrect++;
                document.getElementById('dict-encourage').textContent = '✅ 啱喇!';
                document.getElementById('dict-sentence').innerHTML = `
                    <div style="font-size: 1.2em; color: #4ECDC4; line-height: 1.8;">✓</div>
                    <div style="font-size: 1em; color: #333; margin-top: 10px; font-style: italic;">"${correct}"</div>
                `;
            } else {
                btn.classList.add('wrong');
                dictWrong++;
                dictWrongList.push(dictSentenceList[dictCurrent]);
                document.getElementById('dict-encourage').textContent = '❌ 再聽多次';
                document.getElementById('dict-review-btn').innerHTML = `📝 查看錯題 (${dictWrong})`;
                document.getElementById('dict-review-btn').style.display = 'block';
                document.getElementById('dict-sentence').innerHTML = `
                    <div style="font-size: 1.2em; color: #FF6B6B; line-height: 1.8;">✗</div>
                    <div style="font-size: 1em; color: #666; margin-top: 10px; font-style: italic;">"${correct}"</div>
                `;
            }

            document.getElementById('dict-score').textContent = `✅ ${dictCorrect} | ❌ ${dictWrong}`;

            setTimeout(() => {
                dictCurrent++;
                renderDictSentence();
            }, 2000);
        }

        function showDictFinish() {
            const finishMsg = dictWrong === 0
                ? '🎉 全部答啱喇!勁呀!'
                : `📝 完成!對咗 ${dictCorrect} 題 / 錯咗 ${dictWrong} 題`;

            let wrongCardsHtml = '';
            if (dictWrong > 0) {
                wrongCardsHtml = `
                    <div style="margin: 20px 0; padding: 15px; background: #fff5f5; border-radius: 15px;">
                        <div style="font-size: 1.2em; color: #e74c3c; margin-bottom: 15px;">📝 錯題一覽:</div>
                        <div style="text-align: left; max-height: 200px; overflow-y: auto;">
                            ${dictWrongList.map((w, i) => `
                                <div style="background: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                                    <div style="font-size: 0.9em; color: #666;">句 ${i + 1}</div>
                                    <div style="font-size: 1em; color: #333;">"${w.sentence}"</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('dict-progress').style.width = '100%';
            document.getElementById('dict-progress').textContent = '完成!';

            document.getElementById('dict-options').innerHTML = `
                <div style="text-align:center;padding:30px;">
                    <div style="font-size:3em;margin-bottom:20px;">${dictWrong === 0 ? '🎉' : '💪'}</div>
                    <div style="font-size:1.5em;color:#667eea;margin-bottom:20px;">${finishMsg}</div>
                    ${wrongCardsHtml}
                    <div style="margin-top:30px;">
                        ${dictWrong > 0 ? `<button onclick="reviewDictWrong()" style="padding:15px 30px;font-size:1.2em;background:#FFE66D;border:none;border-radius:15px;cursor:pointer;color:#333;margin:5px;">🔄 溫習錯題 (${dictWrong}句)</button>` : ''}
                        <button onclick="startDictation()" style="padding:15px 30px;font-size:1.2em;background:#4ECDC4;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🔁再做全部</button>
                        <button onclick="initDictation()" style="padding:15px 30px;font-size:1.2em;background:#667eea;border:none;border-radius:15px;cursor:pointer;color:white;margin:5px;">🏠 返去選單</button>
                    </div>
                </div>
            `;
            document.getElementById('dict-hint').textContent = '';
            document.getElementById('dict-encourage').textContent = '';
        }

        function reviewDictWrong() {
            if (dictWrongList.length === 0) return;
            dictSentenceList = [...dictWrongList];
            dictCurrent = 0;
            dictCorrect = 0;
            dictWrong = 0;
            dictWrongList = [];
            dictStarted = true;
            document.getElementById('dict-review-btn').style.display = 'none';
            document.getElementById('dict-review-btn').innerHTML = '';
            renderDictSentence();
        }

        // ========== Completion Modal (M4) ==========
        // Replaces the blocking native alert() that fired when the matching game
        // finished. A custom modal is friendlier for 5yo users (they don't have
        // to dismiss an OS dialog) and lets us animate the celebration.
        function showCompletionModal() {
            const modal = document.getElementById('completion-modal');
            if (modal) modal.style.display = 'flex';
        }

        function closeCompletionModal() {
            const modal = document.getElementById('completion-modal');
            if (modal) modal.style.display = 'none';
            // Replay: re-init the matching board for the active category.
            if (typeof initMatching === 'function') initMatching();
        }
    </script>

    <!-- M4 completion modal markup -->
    <div id="completion-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="completion-title" style="display:none;">
        <div class="modal-content">
            <h2 id="completion-title" style="color:#FF6B6B;margin:0 0 12px 0;font-size:2em;">🎊 完成晒!</h2>
            <p style="font-size:1.2em;color:#333;margin:0 0 20px 0;">勁呀!⭐⭐⭐</p>
            <button onclick="closeCompletionModal()" style="padding:12px 24px;font-size:1.1em;background:#4ECDC4;color:white;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">再玩一次</button>
        </div>
    </div>
</body>
</html>
